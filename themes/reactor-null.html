<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REACTOR NULL — Reactor Mid-Cascade · uispace</title>
<meta name="description" content="Clean-room recreation of a reactor mid-cascade control scene.">
<link rel="stylesheet" href="../shared/u-base.css">
<style>
  .r-core { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .r-core .v { font-family: var(--mono); font-size: clamp(34px, 5vw, 74px); line-height: 1; color: var(--alarm); text-shadow: 0 0 26px color-mix(in srgb, var(--alarm) 60%, transparent); }
  .r-core .k { font-family: var(--mono); font-size: var(--fs-lab); letter-spacing: .3em; color: var(--dim); margin-top: 8px; }
  .r-scram { border: 1px solid var(--alarm); background: color-mix(in srgb, var(--alarm) 12%, transparent); padding: 8px; text-align: center; font-family: var(--mono); letter-spacing: .18em; color: var(--alarm); animation: u-blink 1.4s steps(2,end) infinite; }
</style>
</head>
<body>
<script src="../shared/palettes.js"></script>
<script src="../shared/u-core.js"></script>
<script src="../shared/u-shell.js"></script>
<script src="../shared/u-live.js"></script>
<script>
U.shell({
  name:'reactor-null', brand:'REACTOR NULL', brandSub:'CASCADE',
  subtitle:'REACTOR MID-CASCADE', subtitleSub:'CORE 02 · CONTAINMENT BYPASS · SCRAM ARMED',
  meta:[{r2:'CORE',r1:'<b class="u-alarm">CASCADE</b>'},{r2:'ΔP',r1:'+42.1 MPa'},{r2:'SCRAM',r1:'ARMED',hide:true}],
  status:'CASCADE', statusCls:'u-alarm',
  cols:[
    { panels:[
      { title:'CONTAINMENT', tag:'CORE 02', fill:false, body:'<div class="r-scram">⚠ CASCADE IN PROGRESS · SCRAM ARMED</div><div class="u-bars" style="margin-top:10px">' +
        [['Pressure',92,'u-alarm'],['Temp',88,'u-alarm'],['Flux',71,''],['Coolant',18,'u-cool'],['Rod A',64,''],['Rod B',22,'u-alarm']].map(([n,v,c])=>'<div class="u-brow"><span>'+n+'</span><div class="u-bar '+c+'"><i style="--v:'+v+'%"></i></div><span class="u-n">'+v+'</span></div>').join('') +
        '</div>' },
      { title:'SCRAM', tag:'CONTROL', fill:false, body:'<dl class="u-kv"><dt>State</dt><dd class="u-alarm">ARMED</dd><dt>Authority</dt><dd>SHIFT LEAD</dd><dt>Window</dt><dd>T− 00:42</dd><dt>Bypass</dt><dd>1 / 4</dd></dl>' }
    ]},
    { panels:[
      { title:'CORE VIEW', tag:'MID-CASCADE', hot:true, canvas:'cascade', canvasOpts:{},
        overlay:'<div class="r-core"><div><div class="v" data-tick data-base="88.4" data-drift="0.4" data-dec="1">88.4</div><div class="k">CORE FLUX · % NOMINAL</div></div></div><div class="u-corner tl">NEUTRON FLUX HIGH</div><div class="u-corner tr">T 2,412 K</div><div class="u-corner bl">ΔP +42.1 MPa</div><div class="u-corner br">NO COOLANT</div>' },
      { title:'FLUX HISTORY', tag:'60 s', canvas:'ecg', canvasOpts:{seed:5,color:'--alarm'} }
    ]},
    { panels:[
      { title:'CASCADE LOG', tag:'HIGH RATE', tight:true, scroll:true, body:'<div class="u-log" data-log data-max="12">' +
        U.logLine('09:41:02','ALRM','rod bank B stuck at 22%') +
        U.logLine('09:41:04','ALRM','coolant loop pressure loss') +
        U.logLine('09:41:07','WARN','core flux +18% in 3 s') +
        U.logLine('09:41:11','ALRM','containment margin below 8%') +
        U.logLine('09:41:14','NOTE','scram authority transferred to lead') +
        U.logLine('09:41:19','ALRM','cascade condition confirmed') +
        '</div>' },
      { title:'EXCURSION', tag:'ESTIMATE', fill:false, body:'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="u-stat"><span class="u-v u-alarm">+42.1</span><span class="u-k">ΔP MPa</span></div><div class="u-stat"><span class="u-v">2,412</span><span class="u-k">Core K</span></div><div class="u-stat"><span class="u-v u-accent">88.4</span><span class="u-k">Flux %</span></div><div class="u-stat"><span class="u-v">T−42</span><span class="u-k">To SCRAM</span></div></div>' }
    ]}
  ],
  footer:[{text:'CASCADE',cls:'u-alarm'},{text:'SCRAM ARMED'},{text:'COOLANT 18%',cls:'u-cool'},{text:'REACTOR NULL · core 02'}],
  sign:'REACTOR NULL · mid-cascade'
});
</script>
</body>
</html>
