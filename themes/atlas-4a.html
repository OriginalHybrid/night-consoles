<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS 4-A — Multi-Universe Monitoring Console · uispace</title>
<meta name="description" content="Clean-room recreation of a multi-universe monitoring console wired to live Earth-observation feeds.">
<link rel="stylesheet" href="../shared/u-base.css">
<style>
  .a-uni { display: grid; grid-template-columns: 26px 1fr auto auto; gap: 6px; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--rule2); font-family: var(--mono); font-size: var(--fs-body); }
  .a-uni:last-child { border-bottom: 0; }
  .a-uni .u-id { color: var(--dim); font-size: 8px; }
  .a-uni .u-state { font-size: 8px; }
  .a-evt { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 4px 0; border-bottom: 1px solid var(--rule2); font-family: var(--mono); font-size: var(--fs-body); }
  .a-evt .u-cat { color: var(--dim); font-size: 8px; grid-column: 1 / -1; letter-spacing: .1em; }
</style>
</head>
<body>
<script src="../shared/palettes.js"></script>
<script src="../shared/u-core.js"></script>
<script src="../shared/u-shell.js"></script>
<script src="../shared/u-live.js"></script>
<script>
const UNIS = [
  ['4-A.01','PRIME','STABLE','99.2'],['4-A.02','ECHO','DRIFT','71.4'],['4-A.03','NULL','ISOLATED','—'],
  ['4-A.04','MIRROR','STABLE','98.8'],['4-A.05','TIDE','DRIFT','64.1'],['4-A.06','ASH','DECOHERE','12.0']
];
U.shell({
  name:'atlas-4a', brand:'ATLAS 4-A', brandSub:'MULTIVERSE',
  subtitle:'MULTI-UNIVERSE MONITORING CONSOLE', subtitleSub:'SIX BRANCHES · ONE INVARIANT',
  meta:[{r2:'BRANCHES',r1:'4 / 6 NOMINAL'},{r2:'COHERENCE',r1:'<b class="u-accent">0.914</b>'},{r2:'EPOCH',r1:'4-A.07',hide:true}],
  status:'MONITORING', statusCls:'u-ok',
  cols:[
    { panels:[
      { title:'BRANCHES', tag:'COHERENCE', body: UNIS.map(([id,n,st,p],i)=>'<div class="a-uni'+(i===5?' u-hot':'')+'"><span class="u-id">'+id+'</span><span>'+n+'</span><span class="u-pill '+(st==='STABLE'?'u-ok':st==='DRIFT'?'u-warn':'u-alarm')+'">'+st+'</span><span class="u-n">'+p+'</span></div>').join('') },
      { title:'INVARIANTS', tag:'8 CHECKS', fill:false, body:'<table class="u-tbl"><thead><tr><th>Invariant</th><th>Δ</th><th>Verdict</th></tr></thead><tbody>' +
        [['c','0.000'],['ℏ','0.002'],['G','0.004'],['Λ','0.011'],['α','0.000'],['mₑ','0.001']].map(([k,d],i)=>'<tr'+(i===3?' class="u-hot"':'')+'><td class="u-k">'+k+'</td><td class="u-n">'+d+'</td><td><span class="u-pill '+(i===3?'u-warn':'u-ok')+'">'+(i===3?'DRIFT':'OK')+'</span></td></tr>').join('')+'</tbody></table>' }
    ]},
    { panels:[
      { title:'BRANCH VIEW', tag:'4-A.PRIME', hot:true, canvas:'orbit', canvasOpts:{n:7,hot:0,squash:.38,seed:31,stars:true},
        overlay:'<div class="u-corner tl">SIX-BRANCH PROJECTION</div><div class="u-corner tr">DECOHERENCE 0.086</div><div class="u-corner bl">EPOCH 4-A.07</div><div class="u-corner br">INVARIANT LOCK</div>' },
      { title:'EARTH EVENTS', tag:'LIVE FEED', src:'live', srcLabel:'LIVE', id:'eonet', scroll:true, fill:false, body:'<div id="eonet-rows"><div class="a-evt"><span class="u-cat">LOADING…</span><span></span></div></div>' }
    ]},
    { panels:[
      { title:'SEISMIC', tag:'LIVE FEED', src:'live', srcLabel:'LIVE', id:'quakes', canvas:'contour', canvasOpts:{seed:17,quakes:true},
        overlay:'<div class="u-corner tl">USGS · 24 H</div><div class="u-corner br" id="quake-count">— events</div>' },
      { title:'SIGNAL LOG', tag:'ROLLING', tight:true, scroll:true, body:'<div class="u-log" data-log data-max="9">' +
        U.logLine('14:02','EVT ','branch 4-A.02 coherence 71.4%') +
        U.logLine('14:11','NOTE','invariant Λ drift 0.011') +
        U.logLine('14:24','ALRM','branch 4-A.06 decohering') +
        U.logLine('14:31','EVT ','mirror branch stable') +
        U.logLine('14:42','NOTE','epoch 4-A.07 broadcast received') +
        '</div>' }
    ]}
  ],
  footer:[{text:'4 / 6 NOMINAL'},{text:'COHERENCE 0.914'},{text:'DECOHERE 06',cls:'u-alarm'},{text:'ATLAS 4-A · multiverse'}],
  sign:'ATLAS 4-A · multi-universe console'
});

U.api.eonet().then(({data,state})=>{
  const rows = document.getElementById('eonet-rows'); if (!rows) return;
  rows.innerHTML = data.slice(0,6).map(e=>'<div class="a-evt"><span class="u-cat">'+e.category.toUpperCase()+'</span><span>'+e.title+'</span><span class="u-dim">'+String(e.date).slice(5,10)+'</span></div>').join('');
  const b = document.querySelector('[data-plate="eonet"] .u-src'); U.setSrc(b,state,state==='live'?'LIVE':'SIM');
});
U.api.quakes(2.5).then(({data,state})=>{
  const c = document.getElementById('quake-count');
  if(c) c.textContent = data.length + ' events';
  const b = document.querySelector('[data-plate="quakes"] .u-src'); U.setSrc(b,state,state==='live'?'LIVE':'SIM');
});
</script>
</body>
</html>
