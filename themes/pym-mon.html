<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PYM-MON — Quantum-Scale Particle Monitor · uispace</title>
<meta name="description" content="Clean-room recreation of a quantum-scale particle monitor with detector rings and event counts.">
<link rel="stylesheet" href="../shared/u-base.css">
<style>
  .q-ring { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-family: var(--mono); font-size: var(--fs-body); padding: 4px 0; border-bottom: 1px solid var(--rule2); }
  .q-ring:last-child { border-bottom: 0; }
  .q-ring .u-v { color: var(--accent); }
  .q-pulse { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .q-pulse .n { font-family: var(--mono); font-size: clamp(24px,3vw,44px); color: var(--accent); line-height: 1; }
  .q-pulse .k { font-family: var(--mono); font-size: 8px; letter-spacing: .28em; color: var(--dim); margin-top: 6px; }
</style>
</head>
<body>
<script src="../shared/palettes.js"></script>
<script src="../shared/u-core.js"></script>
<script src="../shared/u-shell.js"></script>
<script src="../shared/u-live.js"></script>
<script>
U.shell({
  name:'pym-mon', brand:'PYM-MON', brandSub:'QUANTUM',
  subtitle:'QUANTUM-SCALE PARTICLE MONITOR', subtitleSub:'DETECTOR 2 · 1.4 K · 10⁻¹⁵ m RESOLUTION',
  meta:[{r2:'EVENTS',r1:'<b class="u-accent">1,204</b>'},{r2:'RATE',r1:'12.4 /s'},{r2:'TEMP',r1:'1.4 K',hide:true}],
  status:'COHERENT', statusCls:'u-ok',
  cols:[
    { panels:[
      { title:'DETECTOR RINGS', tag:'D-2', body:'<div class="q-ring"><span>Ring 01</span><span class="u-v">+0.042 σ</span></div><div class="q-ring"><span>Ring 02</span><span class="u-v">−0.118 σ</span></div><div class="q-ring"><span>Ring 03</span><span class="u-v">+0.204 σ</span></div><div class="q-ring"><span>Ring 04</span><span class="u-v u-alarm">+0.842 σ</span></div><div class="q-ring"><span>Ring 05</span><span class="u-v">−0.036 σ</span></div><div class="q-ring"><span>Ring 06</span><span class="u-v">+0.077 σ</span></div>' +
        '<div style="margin-top:12px"><div class="u-spread"><span class="u-lab">COHERENCE</span><span class="u-num u-accent">0.991</span></div><div class="u-bar u-data"><i style="--v:99%"></i></div></div>' },
      { title:'CALIBRATION', tag:'DRIFT', fill:false, body:'<dl class="u-kv"><dt>Cryo</dt><dd class="u-data">1.4 K</dd><dt>Vacuum</dt><dd>2.1e−10 Pa</dd><dt>Baseline</dt><dd>−0.002 σ</dd><dt>Noise</dt><dd>0.011 σ</dd><dt>Align</dt><dd class="u-accent">locked</dd></dl>' }
    ]},
    { panels:[
      { title:'EVENT FIELD', tag:'10⁻¹⁵ m', hot:true, canvas:'particles', canvasOpts:{n:110,seed:24},
        overlay:'<div class="q-pulse"><div><div class="n" data-tick data-base="1204" data-drift="2" data-dec="0">1204</div><div class="k">EVENTS CAPTURED</div></div></div><div class="u-corner tl">DETECTOR 2</div><div class="u-corner tr">1.4 K</div><div class="u-corner bl">12.4 /s</div><div class="u-corner br">10⁻¹⁵ m</div>' },
      { title:'PULSE TRAIN', tag:'PMT', canvas:'ecg', canvasOpts:{seed:11,color:'--data'} }
    ]},
    { panels:[
      { title:'SPECTRUM', tag:'ENERGY', canvas:'bars', canvasOpts:{n:44,seed:31,speed:1.6} },
      { title:'THRESHOLD', tag:'TRIGGER', fill:false, body:'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="u-stat"><span class="u-v u-accent">0.842σ</span><span class="u-k">Peak</span></div><div class="u-stat"><span class="u-v">0.991</span><span class="u-k">Coherence</span></div><div class="u-stat"><span class="u-v u-data">12.4</span><span class="u-k">Rate /s</span></div><div class="u-stat"><span class="u-v u-alarm">R04</span><span class="u-k">Hot ring</span></div></div>' },
      { title:'MONITOR LOG', tag:'ROLLING', tight:true, scroll:true, body:'<div class="u-log" data-log data-max="8">' +
        U.logLine('01:04','EVT ','detector 2 cooldown complete') +
        U.logLine('01:12','NOTE','ring 04 deviation +0.842σ') +
        U.logLine('01:19','EVT ','event 1,204 captured') +
        U.logLine('01:24','WARN','baseline drift −0.002σ') +
        U.logLine('01:31','EVT ','coherence 0.991 stable') +
        '</div>' }
    ]}
  ],
  footer:[{text:'1,204 EVENTS'},{text:'12.4 /s'},{text:'RING 04 HOT',cls:'u-alarm'},{text:'PYM-MON · quantum monitor'}],
  sign:'PYM-MON · quantum-scale particle monitor'
});
</script>
</body>
</html>
