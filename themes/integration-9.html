<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>INTEGRATION-9 — Mech-Component Integration · uispace</title>
<meta name="description" content="Clean-room recreation of a mech-component integration bay with blueprint viewports.">
<link rel="stylesheet" href="../shared/u-base.css">
<style>
  .i-comp { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 8px; font-family: var(--mono); font-size: var(--fs-body); padding: 4px 0; border-bottom: 1px solid var(--rule2); }
  .i-comp:last-child { border-bottom: 0; }
  .i-comp .u-n { color: var(--dim); font-size: 8px; }
  .i-blue { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<script src="../shared/palettes.js"></script>
<script src="../shared/u-core.js"></script>
<script src="../shared/u-shell.js"></script>
<script src="../shared/u-live.js"></script>
<script>
U.shell({
  name:'integration-9', brand:'INTEGRATION-9', brandSub:'MECH BAY',
  subtitle:'MECH-COMPONENT INTEGRATION', subtitleSub:'BAY 3 · UNIT 09 · FRAME LOCKED',
  meta:[{r2:'COMPONENTS',r1:'12 / 14 SEATED'},{r2:'TORQUE',r1:'<b class="u-accent">412 Nm</b>'},{r2:'PHASE',r1:'ASSEMBLY 3',hide:true}],
  status:'ASSEMBLING', statusCls:'u-warn',
  cols:[
    { panels:[
      { title:'COMPONENTS', tag:'BAY 3', body:'<div>' +
        [['C-01','Actuator L','SEATED'],['C-02','Actuator R','SEATED'],['C-03','Servo cluster','SEATED'],['C-04','Hydraulic line','TORQUE'],['C-05','Power bus','SEATED'],['C-06','Sensor mast','ALIGN'],['C-07','Armor plate','PENDING'],['C-08','Coolant loop','PENDING']].map(([id,n,s],i)=>'<div class="i-comp"><span class="u-accent" style="font-size:8px">'+id+'</span><span>'+n+'</span><span class="u-pill '+(s==='SEATED'?'u-ok':s==='TORQUE'?'u-warn':s==='ALIGN'?'u-warn':'')+'">'+s+'</span></div>').join('') +
        '</div>' },
      { title:'TORQUE SPEC', tag:'C-04', fill:false, body:'<dl class="u-kv"><dt>Spec</dt><dd>420 Nm</dd><dt>Applied</dt><dd class="u-accent">412 Nm</dd><dt>Tolerance</dt><dd>± 8 Nm</dd><dt>Pass</dt><dd class="u-ok">YES</dd><dt>Sequence</dt><dd>4 / 8</dd></dl>' }
    ]},
    { panels:[
      { title:'BLUEPRINT · FRAME', tag:'UNIT 09', hot:true, canvas:'hex', canvasOpts:{size:18,flow:false},
        overlay:'<div class="u-corner tl">WIREFRAME · REV 4</div><div class="u-corner tr">SCALE 1:24</div><div class="u-corner bl">FRAME LOCKED</div><div class="u-corner br">TOL ±0.02 mm</div>' },
      { title:'BLUEPRINT · ARM', tag:'SUB-ASSY', canvas:'flow', canvasOpts:{seed:4,lines:20} }
    ]},
    { panels:[
      { title:'ALIGNMENT', tag:'OPTICAL', canvas:'gridpulse', canvasOpts:{cell:24,seed:8}, overlay:'<div class="u-corner tl">AXIS X 0.002 mm</div><div class="u-corner br">AXIS Y 0.004 mm</div>' },
      { title:'POWER BUS', tag:'LOAD', fill:false, body:'<div class="u-bars">' +
        [['BUS A',68],['BUS B',54],['BUS C',81],['BUS D',42]].map(([n,v])=>'<div class="u-brow"><span>'+n+'</span><div class="u-bar '+(v>75?'u-warn':'u-data')+'"><i style="--v:'+v+'%"></i></div><span class="u-n">'+v+'</span></div>').join('') +
        '</div>' },
      { title:'BAY LOG', tag:'ROLLING', tight:true, scroll:true, body:'<div class="u-log" data-log data-max="8">' +
        U.logLine('12:04','EVT ','frame lock confirmed') +
        U.logLine('12:11','NOTE','C-04 torque 412 / 420 Nm') +
        U.logLine('12:18','WARN','C-07 armor plate delayed') +
        U.logLine('12:24','EVT ','C-06 sensor mast aligned') +
        U.logLine('12:31','EVT ','assembly 3 complete') +
        '</div>' }
    ]}
  ],
  footer:[{text:'12 / 14 SEATED'},{text:'TORQUE 412 Nm'},{text:'ARMOR DELAYED',cls:'u-warn'},{text:'INTEGRATION-9 · bay 3'}],
  sign:'INTEGRATION-9 · mech integration'
});
</script>
</body>
</html>
