<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOOM-9 — Wetware Patch Panel · uispace</title>
<meta name="description" content="Clean-room recreation of a wetware patch panel with signal routing and graft telemetry.">
<link rel="stylesheet" href="../shared/u-base.css">
<style>
  .l-patch { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; font-family: var(--mono); font-size: var(--fs-body); }
  .l-patch .u-p { display: grid; grid-template-columns: 34px 1fr auto; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--rule2); align-items: center; }
  .l-patch .u-p .u-j { color: var(--accent); font-size: 8px; }
  .l-patch .u-p .u-st { font-size: 8px; color: var(--dim); }
  .l-patch .u-p.hot .u-st { color: var(--alarm); }
</style>
</head>
<body>
<script src="../shared/palettes.js"></script>
<script src="../shared/u-core.js"></script>
<script src="../shared/u-shell.js"></script>
<script src="../shared/u-live.js"></script>
<script>
const PATCH = [
  ['J-01','cortex A → loom','OK'],['J-02','cortex B → loom','OK'],['J-03','hippocamp → buffer','OK'],
  ['J-04','buffer → synth 1','DRIFT'],['J-05','synth 1 → cortex A','OK'],['J-06','synth 2 → cortex B','OK'],
  ['J-07','hippocamp → synth 2','OK'],['J-08','buffer → synth 3','OPEN'],['J-09','graft 3 → loom','WARM'],
  ['J-10','graft 3 → buffer','OK']
];
U.shell({
  name:'loom-9', brand:'LOOM-9', brandSub:'WETWARE',
  subtitle:'WETWARE PATCH PANEL', subtitleSub:'LOOM 3 · 10 PATCHES · GRAFT BAY',
  meta:[{r2:'PATCHES',r1:'10 ACTIVE'},{r2:'DRIFT',r1:'<b class="u-warn">J-04</b>'},{r2:'GRAFT',r1:'3 · WARM',hide:true}],
  status:'PATCHED', statusCls:'u-ok',
  cols:[
    { panels:[
      { title:'PATCH BAY', tag:'JACKS', body:'<div class="l-patch">' + PATCH.map(([j,n,st],i)=>'<div class="u-p '+(st==='WARM'?'hot':'')+'"><span class="u-j">'+j+'</span><span>'+n+'</span><span class="u-st">'+st+'</span></div>').join('') + '</div>' },
      { title:'GRAFT 3', tag:'VIABILITY', fill:false, body:'<div class="u-bars">' +
        [['Perfusion',76],['Neural fit',64],['Rejection',12],['Myelin',58],['Temp',71]].map(([n,v])=>'<div class="u-brow"><span>'+n+'</span><div class="u-bar'+(n==='Rejection'?' u-alarm':'')+'"><i style="--v:'+v+'%"></i></div><span class="u-n">'+v+'</span></div>').join('') +
        '</div>' }
    ]},
    { panels:[
      { title:'SIGNAL LOOM', tag:'ROUTING', hot:true, canvas:'gridpulse', canvasOpts:{cell:18,seed:5},
        overlay:'<div class="u-corner tl">TEN PATCHES · ONE LOOM</div><div class="u-corner tr">J-04 DRIFT</div><div class="u-corner bl">LATENCY 4.2 ms</div><div class="u-corner br">GAIN 0.94</div>' },
      { title:'WAVEFORM', tag:'CORTEX A', canvas:'wave', canvasOpts:{lanes:3,amp:.2} }
    ]},
    { panels:[
      { title:'VIABILITY', tag:'GRAFT 3', fill:false, body:'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="u-stat"><span class="u-v u-data">76%</span><span class="u-k">Perfusion</span></div><div class="u-stat"><span class="u-v">4.2</span><span class="u-k">Latency ms</span></div><div class="u-stat"><span class="u-v u-alarm">12%</span><span class="u-k">Rejection</span></div><div class="u-stat"><span class="u-v u-accent">0.94</span><span class="u-k">Gain</span></div></div>' },
      { title:'FLOW', tag:'SIGNAL', canvas:'flow', canvasOpts:{seed:12,lines:26} },
      { title:'LOOM LOG', tag:'ROLLING', tight:true, scroll:true, body:'<div class="u-log" data-log data-max="8">' +
        U.logLine('16:02','EVT ','patch J-04 drift 0.4 ms') +
        U.logLine('16:11','NOTE','graft 3 warming to 37.1 °C') +
        U.logLine('16:24','WARN','rejection marker 12%') +
        U.logLine('16:31','EVT ','cortex A gain normalised') +
        U.logLine('16:44','EVT ','loom handshake complete') +
        '</div>' }
    ]}
  ],
  footer:[{text:'10 PATCHES'},{text:'J-04 DRIFT',cls:'u-warn'},{text:'GRAFT 3 WARM',cls:'u-alarm'},{text:'LOOM-9 · wetware'}],
  sign:'LOOM-9 · wetware patch panel'
});
</script>
</body>
</html>
