<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MERIDIAN OFFICE — Corporate Time-Clock Workstation · uispace</title>
<meta name="description" content="Clean-room recreation of a corporate time-clock workstation with a live world clock.">
<link rel="stylesheet" href="../shared/u-base.css">
<style>
  .m-clock { position: relative; }
  .m-time { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .m-time .t { font-family: var(--mono); font-size: clamp(44px, 6vw, 92px); letter-spacing: .04em; line-height: .9; color: var(--text); font-variant-numeric: tabular-nums; }
  .m-time .d { font-family: var(--mono); font-size: var(--fs-lab); letter-spacing: .3em; color: var(--dim); margin-top: 8px; }
  .m-shift { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
  .m-shift .u-day { font-family: var(--mono); font-size: 8px; letter-spacing: .14em; color: var(--dim); }
  .m-punch { display: grid; grid-template-columns: 52px 1fr auto; gap: 2px 8px; font-family: var(--mono); font-size: var(--fs-body); }
  .m-punch .u-n { color: var(--dim); }
</style>
</head>
<body>
<script src="../shared/palettes.js"></script>
<script src="../shared/u-core.js"></script>
<script src="../shared/u-shell.js"></script>
<script src="../shared/u-live.js"></script>
<script>
const STAFF = [
  ['E-1042','Okafor, D.','IN','07:58:12'],['E-1043','Vance, M.','IN','08:00:03'],
  ['E-1044','Ito, R.','BREAK','12:01:44'],['E-1045','Brandt, K.','IN','08:04:19'],
  ['E-1046','Nakamura, S.','OUT','—'],['E-1047','Clarke, P.','IN','08:11:37'],
  ['E-1048','Mensah, A.','IN','08:12:02'],['E-1049','Larsen, J.','LATE','08:19:55']
];
const PUNCH = [['07:58','E-1042','IN'],['08:00','E-1043','IN'],['08:04','E-1045','IN'],['08:11','E-1047','IN'],['08:12','E-1048','IN'],['08:19','E-1049','LATE'],['12:01','E-1044','BREAK']];

U.shell({
  name:'meridian-office', brand:'MERIDIAN', brandSub:'OFFICE',
  subtitle:'CORPORATE TIME-CLOCK WORKSTATION', subtitleSub:'FLOOR 14 · REGION WEST',
  meta:[{r2:'SHIFT',r1:'DAY 08:00–16:30'},{r2:'ON FLOOR',r1:'<b>37</b> / 42'},{r2:'COMPLIANCE',r1:'98.2%',hide:true}],
  status:'ON SHIFT', statusCls:'u-ok',
  cols:[
    { panels:[
      { title:'SHIFT ROSTER', tag:'FLOOR 14', body:'<table class="u-tbl u-zebra"><thead><tr><th>ID</th><th>Name</th><th>State</th><th class="u-r">Punch</th></tr></thead><tbody>' +
        STAFF.map(([id,n,st,t])=>'<tr><td class="u-k">'+id+'</td><td>'+n+'</td><td><span class="u-pill '+(st==='IN'?'u-ok':st==='LATE'?'u-alarm':'u-warn')+'">'+st+'</span></td><td class="u-n">'+t+'</td></tr>').join('') +
        '</tbody></table>' },
      { title:'PUNCH LOG', tag:'TODAY', tight:true, scroll:true, body:'<div class="u-log">'+PUNCH.map(([t,id,st])=>U.logLine(t,st,id,st==='LATE'?'u-alarm':'')).join('')+'</div>' }
    ]},
    { panels:[
      { title:'MASTER CLOCK', tag:'SYNCED', hot:true, cls:'u-fill m-clock', canvas:'gridpulse', canvasOpts:{cell:34,seed:2},
        overlay:'<div class="m-time"><div><div class="t" data-clock="local">--:--:--</div><div class="d">LOCAL · FLOOR 14 · SYNC ±0.002 s</div></div></div><div class="u-corner tl">REGION WEST</div><div class="u-corner tr">DRIFT +0.0004</div><div class="u-corner bl">NTP · 4 PEERS</div><div class="u-corner br">LOCKED</div>' },
      { title:'ATTENDANCE BAND', tag:'WEEK 41', fill:false, body:
        '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center">' +
        ['M','T','W','T','F','S','S'].map((d,i)=>'<div><div class="u-lab">'+d+'</div><div class="u-tick" style="height:58px;margin-top:4px"><span style="--h:'+(30+((i*37)%55))+'%" class="'+(i<4?'on':'')+'"></span></div><div class="u-num" style="font-size:8px;margin-top:3px">'+(94+((i*7)%6))+'%</div></div>').join('') +
        '</div>' }
    ]},
    { panels:[
      { title:'TIME BANK', tag:'ACCRUAL', fill:false, body:'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
        '<div class="u-stat"><span class="u-v u-accent">+18.4</span><span class="u-k">Hours banked</span></div><div class="u-stat"><span class="u-v">6.2</span><span class="u-k">Overtime</span></div><div class="u-stat"><span class="u-v u-alarm">2</span><span class="u-k">Exceptions</span></div><div class="u-stat"><span class="u-v u-data">98.2%</span><span class="u-k">Compliance</span></div></div>' },
      { title:'WORLD CLOCKS', tag:'LIVE', src:'live', srcLabel:'LIVE', id:'world', fill:false, body:
        '<dl class="u-kv" id="world-rows"><dt>UTC</dt><dd>—</dd><dt>NEW YORK</dt><dd>—</dd><dt>LONDON</dt><dd>—</dd><dt>TOKYO</dt><dd>—</dd></dl>' },
      { title:'NOTICES', tag:'HR', tight:true, scroll:true, body:'<div class="u-log">' +
        U.logLine('08:00','POST','quarterly attendance review posted') +
        U.logLine('08:22','NOTE','floor 14 fire drill at 14:00') +
        U.logLine('09:05','POST','overtime request window closes friday') +
        U.logLine('09:41','NOTE','badge reader 3 intermittent') +
        U.logLine('10:12','POST','shift swap approved: E-1044 / E-1047') +
        '</div>' }
    ]}
  ],
  footer:[{text:'37 ON FLOOR'},{text:'COMPLIANCE 98.2%',hide:true},{text:'EXCEPTIONS 02'},{text:'MERIDIAN OFFICE · floor 14'}],
  sign:'MERIDIAN · corporate time-clock'
});

U.api.timezone('Etc/UTC').then(({data,state})=>{
  const rows = document.getElementById('world-rows'); if (!rows) return;
  const off = (n) => new Date(Date.now() + n * 3600e3).toISOString().slice(11,19);
  rows.innerHTML = '<dt>UTC</dt><dd>'+off(0)+'</dd><dt>NEW YORK</dt><dd>'+off(-4)+'</dd><dt>LONDON</dt><dd>'+off(1)+'</dd><dt>TOKYO</dt><dd>'+off(9)+'</dd>';
  const badge = document.querySelector('[data-plate="world"] .u-src');
  U.setSrc(badge, state, state === 'live' ? 'LIVE' : 'SIM');
});
</script>
</body>
</html>
