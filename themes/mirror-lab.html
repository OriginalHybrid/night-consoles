<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIRROR LAB — Genetic-Mirror Research Bench · uispace</title>
<meta name="description" content="Clean-room recreation of a genetic-mirror research bench comparing twin sequences.">
<link rel="stylesheet" href="../shared/u-base.css">
<style>
  .g-seq { font-family: var(--mono); font-size: var(--fs-body); letter-spacing: .14em; line-height: 1.8; word-break: break-all; }
  .g-seq b { color: var(--accent); } .g-seq i { color: var(--data); font-style: normal; } .g-seq s { color: var(--alarm); text-decoration: none; }
  .g-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .g-pair .u-lab { margin-bottom: 4px; }
</style>
</head>
<body>
<script src="../shared/palettes.js"></script>
<script src="../shared/u-core.js"></script>
<script src="../shared/u-shell.js"></script>
<script src="../shared/u-live.js"></script>
<script>
const SEQ_A = 'ATGCCTAGGCTAACGTTCAGGCAT<span>G</span>TACCGATCGTTAACCGGATTCA';
const SEQ_B = 'ATGCCTAGGCTAACGTTCAGGCAT<span>T</span>TACCGATCGTTAACCGGATTCA';
U.shell({
  name:'mirror-lab', brand:'MIRROR LAB', brandSub:'BENCH 03',
  subtitle:'GENETIC-MIRROR RESEARCH BENCH', subtitleSub:'SPECIMEN PAIR 44-A / 44-B · BLIND PROTOCOL',
  meta:[{r2:'PAIR',r1:'44-A / 44-B'},{r2:'DIVERGENCE',r1:'<b class="u-alarm">0.0031%</b>'},{r2:'RUN',r1:'M-882',hide:true}],
  status:'ALIGNED', statusCls:'u-ok',
  cols:[
    { panels:[
      { title:'ALIGNMENT', tag:'44-A / 44-B', body:'<div class="g-pair"><div><div class="u-lab">SPECIMEN A</div><div class="g-seq" style="color:var(--text)">'+SEQ_A+'</div></div><div><div class="u-lab">SPECIMEN B</div><div class="g-seq" style="color:var(--ink2)">'+SEQ_B+'</div></div></div>' +
        '<div style="margin-top:12px;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.08em">│││││││││││││││││││││││<span class="u-alarm">↑</span>│││││││││││││││││││</div>' },
      { title:'MARKERS', tag:'DIFF', fill:false, body:'<table class="u-tbl"><thead><tr><th>Locus</th><th>A</th><th>B</th><th>Δ</th></tr></thead><tbody>' +
        [['rs-0412','G','T','missense'],['rs-1180','C','C','—'],['rs-2204','A','G','silent'],['rs-3311','T','T','—'],['rs-4402','G','A','regulatory']].map(([l,a,b,d],i)=>'<tr'+(d==='missense'?' class="u-hot"':'')+'><td class="u-k">'+l+'</td><td>'+a+'</td><td>'+b+'</td><td class="'+(d==='—'?'u-dim':'u-accent')+'">'+d+'</td></tr>').join('')+'</tbody></table>' }
    ]},
    { panels:[
      { title:'HELICAL MIRROR', tag:'PAIR 44', hot:true, canvas:'helix', canvasOpts:{n:52,seed:3},
        overlay:'<div class="u-corner tl">STRAND A · 5′→3′</div><div class="u-corner tr">STRAND B · 3′→5′</div><div class="u-corner bl">Δ 1 / 32,000 bp</div><div class="u-corner br">CONF 99.2%</div>' },
      { title:'SIGNAL', tag:'METHYLATION', canvas:'cells', canvasOpts:{seed:22,n:46} }
    ]},
    { panels:[
      { title:'CONCORDANCE', tag:'METRICS', fill:false, body:'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="u-stat"><span class="u-v u-accent">99.97</span><span class="u-k">Concordance</span></div><div class="u-stat"><span class="u-v">32k</span><span class="u-k">Base pairs</span></div><div class="u-stat"><span class="u-v u-data">41</span><span class="u-k">Markers</span></div><div class="u-stat"><span class="u-v u-alarm">3</span><span class="u-k">Divergent</span></div></div>' },
      { title:'COMPARATOR', tag:'CURVE', canvas:'wave', canvasOpts:{lanes:2,amp:.18} },
      { title:'BENCH LOG', tag:'ROLLING', tight:true, scroll:true, body:'<div class="u-log" data-log data-max="9">' +
        U.logLine('11:04','RUN ','alignment M-882 started') +
        U.logLine('11:22','NOTE','pair 44 blind protocol confirmed') +
        U.logLine('11:48','WARN','locus rs-0412 missense candidate') +
        U.logLine('12:02','EVT ','second reader requested') +
        U.logLine('12:19','EVT ','methylation map queued') +
        '</div>' }
    ]}
  ],
  footer:[{text:'PAIR 44-A / 44-B'},{text:'CONCORDANCE 99.97%'},{text:'3 DIVERGENT',cls:'u-alarm'},{text:'MIRROR LAB · bench 03'}],
  sign:'MIRROR LAB · genetic mirror'
});
</script>
</body>
</html>
