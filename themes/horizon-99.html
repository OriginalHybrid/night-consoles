<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HORIZON-99 — Micro-Singularity Observer · uispace</title>
<meta name="description" content="Clean-room recreation of a micro-singularity observer with horizon and Hawking-radiation telemetry.">
<link rel="stylesheet" href="../shared/u-base.css">
<style>
  .h-hor { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .h-hor .n { font-family: var(--mono); font-size: clamp(26px,3.4vw,52px); color: var(--accent); line-height: 1; }
  .h-hor .k { font-family: var(--mono); font-size: 8px; letter-spacing: .3em; color: var(--dim); margin-top: 8px; }
  .h-obs { display: grid; grid-template-columns: 1fr auto; gap: 3px 8px; font-family: var(--mono); font-size: var(--fs-body); padding: 4px 0; border-bottom: 1px solid var(--rule2); }
  .h-obs:last-child { border-bottom: 0; }
</style>
</head>
<body>
<script src="../shared/palettes.js"></script>
<script src="../shared/u-core.js"></script>
<script src="../shared/u-shell.js"></script>
<script src="../shared/u-live.js"></script>
<script>
U.shell({
  name:'horizon-99', brand:'HORIZON-99', brandSub:'SINGULARITY',
  subtitle:'MICRO-SINGULARITY OBSERVER', subtitleSub:'TRAP 99 · 412 kg · HAWKING LUMINOSITY',
  meta:[{r2:'MASS',r1:'<b>412</b> kg'},{r2:'TEMP',r1:'1.2e11 K'},{r2:'LIFE',r1:'T− 4.2e9 s',hide:true}],
  status:'STABLE', statusCls:'u-ok',
  cols:[
    { panels:[
      { title:'OBSERVABLES', tag:'TRAP 99', body:'<div class="h-obs"><span>Mass</span><span class="u-accent">412 kg</span></div><div class="h-obs"><span>Schwarzschild r</span><span>6.1e−25 m</span></div><div class="h-obs"><span>Hawking T</span><span class="u-data">1.2e11 K</span></div><div class="h-obs"><span>Luminosity</span><span>8.4e12 W</span></div><div class="h-obs"><span>Evaporation</span><span class="u-alarm">−1.4e−9 kg/s</span></div><div class="h-obs"><span>Charge</span><span>+0.002 e</span></div><div class="h-obs"><span>Spin</span><span>0.41 a*</span></div>' +
        '<div style="margin-top:12px"><div class="u-spread"><span class="u-lab">TRAP FIELD</span><span class="u-num u-accent">98.2%</span></div><div class="u-bar u-data"><i style="--v:98%"></i></div></div>' },
      { title:'TRAP', tag:'COILS', fill:false, body:'<div class="u-bars">' +
        [['Coil A',88],['Coil B',91],['Coil C',84],['Coil D',93],['Cryo',76],['Vacuum',97]].map(([n,v])=>'<div class="u-brow"><span>'+n+'</span><div class="u-bar '+(v<85?'u-warm':'u-data')+'"><i style="--v:'+v+'%"></i></div><span class="u-n">'+v+'</span></div>').join('') +
        '</div>' }
    ]},
    { panels:[
      { title:'HORIZON', tag:'TRAP 99', hot:true, canvas:'orbit', canvasOpts:{n:5,hot:0,squash:.18,seed:41,stars:true},
        overlay:'<div class="h-hor"><div><div class="n" data-tick data-base="412.0" data-drift="0.02" data-dec="1">412.0</div><div class="k">MASS · kg</div></div></div><div class="u-corner tl">EVENT HORIZON</div><div class="u-corner tr">r 6.1e−25 m</div><div class="u-corner bl">T 1.2e11 K</div><div class="u-corner br">a* 0.41</div>' },
      { title:'RADIATION', tag:'HAWKING', canvas:'bars', canvasOpts:{n:50,seed:23,speed:1.4} }
    ]},
    { panels:[
      { title:'SPECTRUM', tag:'GAMMA', canvas:'wave', canvasOpts:{lanes:2,amp:.22} },
      { title:'CAGE', tag:'FIELD', fill:false, body:'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="u-stat"><span class="u-v u-accent">98.2%</span><span class="u-k">Field</span></div><div class="u-stat"><span class="u-v u-data">1.2e11</span><span class="u-k">Temp K</span></div><div class="u-stat"><span class="u-v">8.4e12</span><span class="u-k">Lum W</span></div><div class="u-stat"><span class="u-v u-alarm">−1.4e−9</span><span class="u-k">kg/s</span></div></div>' },
      { title:'OBSERVER LOG', tag:'ROLLING', tight:true, scroll:true, body:'<div class="u-log" data-log data-max="8">' +
        U.logLine('02:04','EVT ','trap 99 field 98.2%') +
        U.logLine('02:12','NOTE','Hawking temp 1.2e11 K') +
        U.logLine('02:19','WARN','evaporation −1.4e−9 kg/s') +
        U.logLine('02:24','EVT ','spin 0.41 a* stable') +
        U.logLine('02:31','EVT ','horizon stable') +
        '</div>' }
    ]}
  ],
  footer:[{text:'412 kg'},{text:'T 1.2e11 K'},{text:'EVAP −1.4e−9 kg/s',cls:'u-alarm'},{text:'HORIZON-99 · singularity'}],
  sign:'HORIZON-99 · micro-singularity observer'
});
</script>
</body>
</html>
